<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深圳贝岭</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
    <script>
        const loaderColor = localStorage.getItem('JooTang-initial-loader-bg') || '#FFFFFF'
        const primaryColor = localStorage.getItem('JooTang-initial-loader-color') || '#16B1FF'

        if (loaderColor)
          document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)
        if (loaderColor)
          document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)

        if (primaryColor)
          document.documentElement.style.setProperty('--initial-loader-color', primaryColor)
    </script>
</head>

<body>
  <div id="app" style="background-color: #adb5bd">
    <div id="loading-bg">
      <div class="loading-logo">
        <!-- Belling Logo -->
        <svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:var(--initial-loader-color);stop-opacity:1">
                <animate attributeName="stop-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
              </stop>
              <stop offset="50%" style="stop-color:var(--initial-loader-color);stop-opacity:0.8">
                <animate attributeName="stop-opacity" values="0.8;0.5;0.8" dur="2s" repeatCount="indefinite"/>
              </stop>
              <stop offset="100%" style="stop-color:var(--initial-loader-color);stop-opacity:1">
                <animate attributeName="stop-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
              </stop>
            </linearGradient>

            <style>
              @keyframes breathe {
                0%, 100% {
                  opacity: 0.8;
                  transform: scale(1);
                }
                50% {
                  opacity: 1;
                  transform: scale(1.05);
                }
              }
              .logo-text {
                animation: breathe 3s ease-in-out infinite;
                transform-origin: center;
              }
            </style>
          </defs>

          <g class="logo-text" fill="url(#gradient)">
            <!-- B -->
            <path d="M 10 15 L 10 45 L 24 45 C 29 45 33 41 33 36 C 33 32.5 31 29.5 28 28.5 C 30.5 27.5 32 24.5 32 22 C 32 17 28 15 23 15 Z M 16 20 L 23 20 C 25 20 27 21.5 27 23.5 C 27 25.5 25 27 23 27 L 16 27 Z M 16 32 L 24 32 C 26 32 28 33.5 28 35.5 C 28 37.5 26 39 24 39 L 16 39 Z"/>

            <!-- E -->
            <path d="M 40 15 L 40 45 L 60 45 L 60 39 L 46 39 L 46 32 L 58 32 L 58 27 L 46 27 L 46 21 L 60 21 L 60 15 Z"/>

            <!-- L -->
            <path d="M 67 15 L 67 45 L 87 45 L 87 39 L 73 39 L 73 15 Z"/>

            <!-- L -->
            <path d="M 94 15 L 94 45 L 114 45 L 114 39 L 100 39 L 100 15 Z"/>

            <!-- I -->
            <path d="M 121 15 L 121 45 L 127 45 L 127 15 Z"/>

            <!-- N -->
            <path d="M 134 15 L 134 45 L 140 45 L 140 25 L 154 45 L 160 45 L 160 15 L 154 15 L 154 35 L 140 15 Z"/>

            <!-- G -->
            <path d="M 177 15 C 171 15 167 19 167 24 L 167 36 C 167 41 171 45 177 45 C 183 45 187 41 187 36 L 187 30 L 177 30 L 177 35 L 181 35 L 181 36 C 181 38 180 39 177 39 C 174 39 173 38 173 36 L 173 24 C 173 22 174 21 177 21 C 180 21 181 22 181 24 L 187 24 C 187 19 183 15 177 15 Z"/>
          </g>

          <!-- Accent underline with slide animation -->
          <line x1="10" y1="50" x2="187" y2="50" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round">
            <animate attributeName="stroke-dasharray" values="0,177;177,0;0,177" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" values="0;-177;-354" dur="3s" repeatCount="indefinite"/>
          </line>
        </svg>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>

</body>

</html>
